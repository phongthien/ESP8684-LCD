name: Build ESP8684

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Update index
        run: arduino-cli core update-index

      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.2
      - name: Patch boards.txt
        run: |
          BOARDS="$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.11/boards.txt"
          sed -i 's/bootloader_qio_60m.elf/bootloader_qio_40m.elf/g' "$BOARDS"

      - name: Install U8g2
        run: |
          arduino-cli lib install "U8g2"

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c2 \
            --output-dir build \
            .

      - name: Upload BIN
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/
