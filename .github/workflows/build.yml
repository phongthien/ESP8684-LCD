name: Build ESP-IDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32c2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32c2-bin
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
